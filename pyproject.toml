[project]
name = "recursiverpc"
version = "0.1.0"
description = "Run Python functions across local processes and recursive SSH worker pools with RPyC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Imam-f", email = "mohamadimamfirdaus17@gmail.com" }
]
requires-python = "~=3.10.16"
dependencies = [
    "packaging>=24.2",
    "paramiko>=3.5.1",
    "plumbum>=1.9.0",
    "pywin32>=306 ; sys_platform == 'win32'",
    "rpyc>=6.0.2",
    "tomlkit>=0.13.2",
    "uv>=0.7.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "python-dotenv>=1.1.1",
]
